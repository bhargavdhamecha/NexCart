plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nexcart'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Spring Cloud 2025.1.0 ("Oakwood") is the release train built for Spring Boot 4 / Spring
// Framework 7 — matches this app's Boot 4.1.1, same as backend/build.gradle. Brings Spring
// Cloud Gateway 5.0.x transitively via spring-cloud-starter-gateway below.
dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.0"
	}
}

dependencies {
	// Reactive (WebFlux/Netty) — deliberately no spring-boot-starter-web alongside this; mixing
	// the servlet and reactive stacks in one app is a common source of "which server actually
	// started" confusion. Spring Cloud Gateway 5.x split the old single "gateway" starter into
	// separate webflux/webmvc artifacts — this is the reactive one.
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	// Reactive Redis client — RedisRateLimiter needs a ReactiveStringRedisTemplate, which this
	// starter's autoconfiguration provides (unlike backend's plain spring-boot-starter-data-redis).
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	// /actuator/health, used by Dockerfile's HEALTHCHECK and docker-compose.yml's
	// depends_on: condition: service_healthy.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
