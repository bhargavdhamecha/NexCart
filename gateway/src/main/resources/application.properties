spring.application.name=gateway
server.port=8081

# Spring Cloud's release train hasn't caught up to Boot 4.1.x yet — every 2025.1.x patch
# (checked up to .3) declares itself compatible only with Boot 4.0.x, and refuses to start
# otherwise. Everything this app actually uses (Gateway 5.0.x's real APIs, DI wiring) compiles
# and resolves cleanly against 4.1.1 regardless — this is a version-string gate, not an actual
# incompatibility, same category of bleeding-edge lag as backend's Kafka-autoconfiguration gap.
spring.cloud.compatibility-verifier.enabled=false

#------------------ Backend (routed to, not autodiscovered — no service discovery, per
# context.md's "avoid service discovery early" guidance) -----------------
app.gateway.backend-uri=${BACKEND_URI:http://localhost:8080}

#------------------ Redis (backs RedisRateLimiter's token buckets) -----------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

#------------------ CORS -----------------
# Not configured here — Spring Cloud Gateway's own globalcors/add-to-simple-url-handler-mapping
# mechanism proved ineffective against real preflight requests on this SCG 5.0.x / Boot 4.1.1
# combination (bare 200s, no CORS headers). Handled instead by config/CorsPreflightFilter.java,
# a hand-written WebFilter — see that class's javadoc. Only exercised by local cross-port dev
# (ng serve on :4200 talking to this gateway on :8081); in production the frontend's own nginx
# reverse-proxies same-origin, so this filter never fires for real traffic.

#------------------ Actuator -----------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
