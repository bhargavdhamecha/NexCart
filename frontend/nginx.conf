server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA with PathLocationStrategy — any non-file path falls back to index.html so
    # client-side routing (app.routes.ts) owns it instead of nginx 404ing on e.g. /products/3.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy to the gateway by Compose service name over the internal Docker network —
    # never published to the host, only reachable from here. Trailing slashes on both the
    # location and proxy_pass matter: nginx substitutes the location prefix for the proxy_pass
    # path, so /api/v1/auth/login -> http://gateway:8081/api/v1/auth/login, preserving the
    # refresh-token cookie's path (/api/v1/auth) unchanged.
    location /api/v1/ {
        proxy_pass http://gateway:8081/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
