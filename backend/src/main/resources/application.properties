spring.application.name=backend

#------------------ Swagger / OpenAPI -----------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

#------------------ Postgres SQL -----------------
# DB_HOST defaults to localhost for plain `./gradlew bootRun`; docker-compose.yml overrides it
# to the `postgres` service name for the containerized backend. On this machine specifically,
# running bootRun directly against Dockerized-infra-only Postgres needs DB_HOST=[::1]
# (brackets included) — see CLAUDE.md's IPv4/Docker Desktop loopback gotcha.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexcart}
spring.datasource.username=${DB_USER:nexcart_user}
spring.datasource.password=${DB_PASSWORD:nexcart_password}

spring.datasource.hikari.pool-name=NexcartHikariPool
# Trimmed from 10/10 — matches docker-compose.yml's Postgres max_connections=40, sized for a
# 1GB deployment target where each reserved connection has a real memory cost.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:change-this-development-jwt-secret-change-this-123456}
app.security.access-token-ttl=15m
app.security.refresh-token-ttl=30d
app.security.refresh-cookie-name=nexcart_refresh_token
app.security.refresh-cookie-path=/api/v1/auth
app.security.refresh-cookie-secure=${APP_SECURITY_REFRESH_COOKIE_SECURE:false}
app.security.cors-allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:4200}

#------------------ Product images (Backblaze B2, S3-compatible) -----------------
# No safe default for real credentials — left blank on purpose. The app still boots without
# these set; only image upload/delete will fail until they're configured (see StorageService).
app.storage.endpoint=${B2_ENDPOINT:}
app.storage.region=${B2_REGION:us-west-004}
app.storage.bucket=${B2_BUCKET:}
app.storage.access-key-id=${B2_ACCESS_KEY_ID:}
app.storage.secret-access-key=${B2_SECRET_ACCESS_KEY:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#------------------ Kafka -----------------
# Read directly by config.KafkaConfig, not by Spring Boot autoconfiguration — this Spring
# Boot/spring-kafka version combination doesn't ship any (see that class's javadoc).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=nexcart-backend
spring.kafka.consumer.properties.spring.json.trusted.packages=com.nexcart.backend.common.event

#------------------ Email (Resend SMTP relay) -----------------
# Resend: host smtp.resend.com, username is literally "resend", password is your Resend API key.
# No safe default for real credentials — left blank on purpose, same pattern as B2 storage above.
# The free onboarding@resend.dev sender works without verifying a domain, but only delivers to
# your own Resend account email until you verify a sending domain.
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.notification.from-address=onboarding@resend.dev

#------------------ Payments (Razorpay, test/sandbox mode) -----------------
# No safe default for real credentials — left blank on purpose, same pattern as B2/Resend above.
# Get test keys from the Razorpay Dashboard (Test Mode > Settings > API Keys). The app still
# boots without these set; only /payments/initiate will fail (503, PAYMENT_GATEWAY_NOT_CONFIGURED)
# until they're configured.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

#------------------ Redis (product catalog caching) -----------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

#------------------ Actuator -----------------
# Only /actuator/health is exposed — used by Docker/Compose healthchecks (see backend/Dockerfile
# and docker-compose.yml). SecurityConfig already permitAlls /actuator/**.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Mail's health indicator opens a live SMTP connection to check itself — found live to hang
# 18-70+s per call against smtp.resend.com when MAIL_PASSWORD is unset/invalid, starving the
# Tomcat worker pool and making /actuator/health itself time out. A container health probe
# should never depend on reaching a third-party SMTP server's reachability, so it's disabled
# outright rather than just excluded from the response — an unrelated mail outage shouldn't
# mark this instance unhealthy anyway (email delivery already degrades independently, see
# NotificationServiceImpl). management.health.mail.enabled=false alone was NOT sufficient to
# actually stop it firing (confirmed live) — excluding the autoconfiguration class outright is
# the fix that actually works.
management.health.mail.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailHealthContributorAutoConfiguration
