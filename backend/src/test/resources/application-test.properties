spring.datasource.url=jdbc:h2:mem:nexcart;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.security.jwt-secret=test-jwt-secret-test-jwt-secret-1234567890
app.security.access-token-ttl=15m
app.security.refresh-token-ttl=30d
app.security.refresh-cookie-name=nexcart_refresh_token
app.security.refresh-cookie-path=/api/v1/auth
app.security.refresh-cookie-secure=true

# No real Kafka broker in tests — FakeEventPublisherImpl (test profile) handles publishing;
# this just stops the @KafkaListener container from trying to connect/poll on startup.
spring.kafka.listener.auto-startup=false

# No real Razorpay call in tests — FakeRazorpayGatewayClientImpl (test profile) handles
# order creation/signature verification deterministically. key-id just needs to be non-blank
# so it round-trips through PaymentSummary; key-secret is never read by the fake.
app.razorpay.key-id=rzp_test_fake_key_id_for_tests
app.razorpay.key-secret=unused-fake-does-not-read-this
